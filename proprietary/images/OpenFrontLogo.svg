<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 259" fill="none">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Tactical Hex Emblem -->
  <g transform="translate(30, 22)" filter="url(#glow)">
    <!-- Outer Hexagon -->
    <polygon
      points="107,0 200,54 200,161 107,215 14,161 14,54"
      fill="rgba(15, 23, 42, 0.85)"
      stroke="url(#hexGrad)"
      stroke-width="12"
      stroke-linejoin="round"
    />
    <!-- Inner Tactical Territory Shards -->
    <polygon points="107,26 176,66 107,107" fill="#38bdf8" opacity="0.9" />
    <polygon points="176,66 176,148 107,107" fill="#06b6d4" opacity="0.75" />
    <polygon points="176,148 107,189 107,107" fill="#4f46e5" opacity="0.85" />
    <polygon points="107,189 38,148 107,107" fill="#6366f1" opacity="0.6" />
    <polygon points="38,148 38,66 107,107" fill="#0284c7" opacity="0.8" />
    <polygon points="38,66 107,26 107,107" fill="#7dd3fc" opacity="0.95" />
    <!-- Center Core Node -->
    <circle cx="107" cy="107" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
    <circle cx="107" cy="107" r="7" fill="#22d3ee" />
  </g>

  <!-- Typography: BORDER (White/Slate) + CONFLICT (Cyan/Indigo Gradient) using tspan so they cannot overlap -->
  <text x="270" y="174" font-family="'Inter', 'Segoe UI', Roboto, system-ui, sans-serif" font-weight="900" font-size="124" letter-spacing="4">
    <tspan fill="url(#textGrad)">BORDER </tspan>
    <tspan fill="url(#accentGrad)">CONFLICT</tspan>
  </text>

  <!-- Subtle bottom tactical accent bar -->
  <rect x="270" y="198" width="1370" height="7" rx="3.5" fill="url(#accentGrad)" opacity="0.9" />
</svg>
