<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bcHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="bcRadarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#0a120c" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050a06" />
    </radialGradient>
    <linearGradient id="bcJetGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <!-- Heavy Outer Armor Hexagon -->
  <polygon
    points="32,2 60,17 60,47 32,62 4,47 4,17"
    fill="url(#bcRadarGlow)"
    stroke="url(#bcHexGrad)"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Tactical Hexagon -->
  <polygon
    points="32,7 55,19 55,45 32,57 9,45 9,19"
    fill="none"
    stroke="#22c55e"
    stroke-width="1"
    stroke-opacity="0.35"
    stroke-dasharray="2,3"
  />

  <!-- Radar Concentric Rings -->
  <circle cx="32" cy="32" r="22" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3" fill="none" />
  <circle cx="32" cy="32" r="14" stroke="#22c55e" stroke-width="1" stroke-opacity="0.45" fill="none" />
  <circle cx="32" cy="32" r="6" stroke="#4ade80" stroke-width="1.2" stroke-opacity="0.6" fill="none" />

  <!-- Radar Crosshairs (4 axes) -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4" />
  <line x1="8" y1="32" x2="56" y2="32" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4" />

  <!-- Target Lock Brackets -->
  <path d="M 20,23 L 20,20 L 23,20" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 44,23 L 44,20 L 41,20" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 20,41 L 20,44 L 23,44" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 44,41 L 44,44 L 41,44" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Stealth Fighter / Delta Wings War Emblem -->
  <path
    d="M 32,13 L 43,37 L 37,34 L 32,46 L 27,34 L 21,37 Z"
    fill="url(#bcJetGrad)"
    stroke="#0a120c"
    stroke-width="1"
    stroke-linejoin="round"
  />

  <!-- Glowing Radar Core Ping -->
  <circle cx="32" cy="32" r="2.5" fill="#fef08a" />
</svg>
