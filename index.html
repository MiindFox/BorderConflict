<!doctype html>
<html lang="en" class="h-full preload" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title data-i18n="main.title">BorderConflict</title>
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="BorderConflict" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="<%- manifestHref %>" />
    <link rel="icon" type="image/svg+xml" href="<%- faviconHref %>" />
    <link rel="apple-touch-icon" href="<%- faviconHref %>" />

    <!-- Retro Military Pixel Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />

    <!-- Preload styles -->
    <style>
      html {
        color-scheme: dark;
      }

      html.preload {
        visibility: visible !important;
        opacity: 1 !important;
        background-color: #111827 !important;
      }

      html.preload body {
        visibility: hidden;
        opacity: 0;
      }

      .preload {
        visibility: hidden;
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }

      /* iOS safe area support */
      body {
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }

      /* Prevent Playwire bottom rail from affecting flex layout,
         and keep it below the bottom HUD (z-[200]) so it can't cover the control panel */
      [id^="pw-oop-bottom_rail"] {
        position: fixed !important;
        z-index: 150 !important;
      }

      /* Playwire flex leaderboard (header ad): Playwire inlines
         z-index 2147483647 on it — cap it below modals and the mobile drawer,
         like the bottom rail. The sticky nav shifts below it via
         --top-ad-height, and page content via --top-ad-pad, both measured by
         HomepagePromos, so it never covers the menu bar. */
      #pw-oop-flex,
      #adBanner.leaderboard_ad {
        z-index: 150 !important;
      }

      /* Gutter rails (left/right) get the same inline max z-index, which put
         them over the featured Twitch player (z-[45000]) and its close
         button. Cap them like the other units. */
      [id^="pw-oop-left_rail"],
      [id^="pw-oop-right_rail"] {
        z-index: 150 !important;
      }

      /* The flex unit's inline (expanded) state renders into
         #pw-oop-flex_container, a direct <body> child. Body is a flex row,
         which squeezed it to width 0 — the unit could never show its
         expanded state or sense scrolling, so it latched permanently into
         the docked leaderboard. Give it its own full-width line at the top
         of the page (body wraps; the content area follows on the next
         line), so it expands at the top and docks once scrolled past.
         HomepagePromos locks its min-height to the expanded ad height once
         seen, so dock/undock never changes the document height (which would
         jump the scroll position mid-scroll). */
      #pw-oop-flex_container {
        order: -1;
        flex-basis: 100%;
        width: 100%;
      }
      /* While an inline page (store, settings, ...) is open the document is
         locked at scroll 0 (see styles.css), so the unit would sit expanded
         (350px tall) in flow above the modal for as long as the page is open,
         squeezing the modal to a sliver. Playwire docks the unit through an
         IntersectionObserver on this container, so park the container just
         above the viewport instead: the unit then collapses to its fixed
         leaderboard (measured into --top-ad-height, which pads the content
         area below), and re-expands in flow when the page closes. No
         transform here — the docked unit is position: fixed and must keep
         the viewport as its containing block. */
      body.page-open #pw-oop-flex_container {
        position: fixed;
        bottom: 100%;
        left: 0;
        width: 100%;
      }
      /* Playwire docks the unit with position: fixed and top: auto, i.e. at
         its static (in-flow) position — which is now above the viewport. */
      body.page-open #pw-oop-flex {
        top: 0;
      }

      /* Google Funding Choices CCPA link override */
      .fc-dns-link,
      .fc-ccpa-root,
      .fc-consent-root {
        position: fixed !important;
        z-index: 999999 !important;
      }
      .fc-dns-link {
        bottom: 15px !important;
        left: 15px !important;
      }

      /* Ensure full viewport height on iOS; body grows with content so the
         document scrolls (see styles.css) */
      html {
        height: 100%;
        height: -webkit-fill-available;
      }
      body {
        min-height: 100%;
        min-height: -webkit-fill-available;
      }

      /* Disable iOS double-tap "smart zoom" on the page; the game has its
         own map zoom. Panning/scrolling stays allowed. See issue #4609. */
      html,
      body {
        touch-action: manipulation;
      }
    </style>

    <!-- SEO -->
    <meta
      name="description"
      content="Conquer the world in BorderConflict! Expand your territory, forge alliances, and dominate the tactical map in this fast-paced real-time strategy game."
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="BorderConflict - Tactical Territory Strategy"
    />
    <meta
      property="og:description"
      content="Conquer the world in BorderConflict! Expand your territory, forge alliances, and dominate the tactical map in this fast-paced real-time strategy game."
    />
    <meta property="og:image" content="<%- gameplayScreenshotUrl %>" />
    <meta property="og:type" content="game" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "BorderConflict",
        "alternateName": "BorderConflict",
        "description": "Conquer the world in BorderConflict! Expand your territory, forge alliances, and dominate the tactical map in this fast-paced real-time strategy game.",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "gamePlatform": ["Web Browser", "PC", "Mobile"],
        "genre": ["Strategy", "Multiplayer", "RTS"],
        "playMode": "MultiPlayer",
        "inLanguage": "en",
        "isAccessibleForFree": true
      }
    </script>

    <!--
      Injected from Server env.

      Every per-server value (cluster, instanceLetter, instanceId, serverHost,
      siteHost) is emitted through a guard so the whole line — indentation and
      trailing comma included — disappears when the renderer does not supply
      it. That is what lets one page be rendered per VERSION rather than per
      server and uploaded to the CDN (docs/MultiServer.md, "Publish pipeline
      (v2)"); a game server supplies them all and gets exactly the page it
      always served.

      Never add a placeholder the Steam shell does not supply: openfront-desktop
      renders this same template itself and a missing local is a ReferenceError,
      i.e. a blank window. Guarding an existing one is safe — the shell supplies
      a value and the line still emits.
    -->
    <script>
      window.BOOTSTRAP_CONFIG = {
        gitCommit: <%- gitCommit %>,
        assetManifest: <%- assetManifest %>,
        cdnBase: <%- cdnBase %>,
        gameEnv: <%- gameEnv %>,<%- typeof cluster !== "undefined" && cluster ? "\n        cluster: " + cluster + "," : "" %><%- typeof instanceLetter !== "undefined" && instanceLetter ? "\n        instanceLetter: " + instanceLetter + "," : "" %>
        turnstileSiteKey: <%- turnstileSiteKey %>,
        jwtAudience: <%- jwtAudience %>,<%- typeof stripePublishableKey !== "undefined" && stripePublishableKey ? "\n        stripePublishableKey: " + stripePublishableKey + "," : "" %><%- typeof faroCollectorUrl !== "undefined" && faroCollectorUrl ? "\n        faroCollectorUrl: " + faroCollectorUrl + "," : "" %><%- typeof instanceId !== "undefined" && instanceId ? "\n        instanceId: " + instanceId + "," : "" %><%- typeof serverHost !== "undefined" && serverHost ? "\n        serverHost: " + serverHost + "," : "" %><%- typeof siteHost !== "undefined" && siteHost ? "\n        siteHost: " + siteHost + "," : "" %>
      };
      // Set here rather than from the bundle so the first paint already has the
      // desktop layout. The shell's preload defines openfrontDesktop before
      // any page script runs. ?desktop-layout previews it outside prod.
      if (
        window.openfrontDesktop ||
        (window.BOOTSTRAP_CONFIG.gameEnv !== "prod" &&
          new URLSearchParams(location.search).has("desktop-layout"))
      ) {
        document.documentElement.classList.add("desktop-shell");
      }
      document.documentElement.style.setProperty(
        "--background-image-url",
        `url("<%- backgroundImageUrl %>")`,
      );
    </script>

    <!-- Cloudflare Turnstile -->
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
  </head>

  <body
    class="select-none font-sans min-h-screen bg-[#0b0f0c] transition-opacity duration-300 ease-in-out flex flex-col overflow-x-hidden"
  >
    <retro-terminal-boot></retro-terminal-boot>

    <div
      id="hex-grid"
      class="fixed inset-0 -z-50 pointer-events-none hidden"
    ></div>

    <!-- LEFT SIDEBAR MENU -->

    <div
      id="mobile-menu-backdrop"
      class="lg:hidden! in-[.in-game]:hidden hidden pointer-events-none [&.open]:block [&.open]:pointer-events-auto [&.open]:fixed [&.open]:inset-0 [&.open]:bg-black/60 [&.open]:z-[40000] transition-opacity"
      role="presentation"
      aria-hidden="true"
    ></div>

    <mobile-nav-bar
      id="sidebar-menu"
      class="peer [.in-game_&]:hidden z-[40001] fixed left-0 top-0 h-full flex flex-col justify-start overflow-visible bg-[#101712]/95 backdrop-blur-xl border-r-2 border-[#2b3a2a] transition-transform duration-500 ease-out transform -translate-x-full w-[80%] max-w-[320px] [&.open]:translate-x-0 lg:hidden shadow-[0_0_30px_rgba(0,0,0,0.8)]"
      role="dialog"
      data-i18n-aria-label="main.menu"
    ></mobile-nav-bar>

    <!-- MAIN CONTENT AREA -->
    <div
      class="in-[.in-game]:hidden flex-1 basis-full min-w-0 h-dvh min-h-dvh in-[.page-open]:min-h-0 in-[.page-open]:overflow-hidden relative pt-[var(--top-ad-pad,0px)] in-[.page-open]:pt-[var(--top-ad-height,0px)] transition-[margin] duration-500 ease-out will-change-[margin-left] flex flex-col p-1 sm:p-2 overflow-hidden"
    >
      <!-- Retro Military CRT Monitor Chassis Wrapper -->
      <div
        class="crt-chassis relative flex-1 flex flex-col w-full h-full min-h-0 overflow-hidden"
      >
        <!-- 4 Corner Screws -->
        <div class="crt-screw crt-screw-tl hidden sm:block"></div>
        <div class="crt-screw crt-screw-tr hidden sm:block"></div>
        <div class="crt-screw crt-screw-bl hidden sm:block"></div>
        <div class="crt-screw crt-screw-br hidden sm:block"></div>

        <!-- Inner Curved CRT Screen Container -->
        <div
          class="crt-screen-container relative flex-1 flex flex-col w-full h-full min-h-0 overflow-hidden"
        >
          <!-- Direct CRT Silo Hangar Screen Layer with Surveillance Camera Breathing -->
          <div
            class="hangar-bg-live absolute inset-0 bg-cover bg-center pointer-events-none z-0"
            style="
              background-image: var(--background-image-url);
              filter: brightness(0.92) contrast(1.15);
            "
          ></div>
          <!-- Silo Arc-Welding Sparks Overlay -->
          <div class="hangar-welding-glow pointer-events-none"></div>
          <!-- Silo Safety Beacon Pulse Overlay -->
          <div class="hangar-siren-beacon pointer-events-none"></div>
          <!-- Silo Industrial Steam Mist Overlay -->
          <div class="hangar-steam-mist pointer-events-none"></div>
          <!-- CRT Scanlines Overlay -->
          <div
            class="absolute inset-0 crt-scanlines opacity-40 pointer-events-none z-10"
          ></div>
          <!-- CRT Glass Vignette & Phosphor Glow -->
          <div
            class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_45%,rgba(0,0,0,0.85)_100%)] pointer-events-none z-10"
          ></div>

          <!-- Desktop Top Bar -->
          <desktop-nav-bar
            class="sticky top-[var(--top-ad-height,0px)] z-[60] shrink-0 in-[.page-open]:static"
          ></desktop-nav-bar>

          <div
            id="turnstile-container"
            class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-99999"
          ></div>

          <banned-modal></banned-modal>

          <!-- Main container with responsive padding -->
          <main-layout class="contents">
            <play-page class="contents"></play-page>
            <matchmaking-modal
              id="page-matchmaking"
              inline
              class="hidden w-full h-full page-content relative z-50"
            ></matchmaking-modal>
            <news-modal
              id="page-news"
              inline
              class="hidden w-full h-full page-content relative z-50"
            ></news-modal>
            <single-player-modal
              id="page-single-player"
              inline
              class="hidden w-full h-full page-content relative z-50"
            ></single-player-modal>
            <host-lobby-modal
              id="page-host-lobby"
              inline
              class="hidden w-full h-full page-content relative z-50"
            ></host-lobby-modal>
            <join-lobby-modal
              id="page-join-lobby"
              inline
              class="hidden w-full h-full page-content relative z-50"
            ></join-lobby-modal>
            <store-modal
              id="page-item-store"
              inline
              class="hidden w-full h-full page-content relative z-50"
            ></store-modal>
            <user-setting
              id="page-settings"
              inline
              class="hidden w-full h-full page-content relative z-50"

            <leaderboard-modal
              id="page-leaderboard"

            <troubleshooting-modal
              id="page-troubleshooting"

              class="hidden w-full h-full page-content relative z-50"
            ></troubleshooting-modal>

            <clan-modal
              id="page-clan"
              inline
              class="hidden w-full h-full page-content relative z-50"
            ></clan-modal>
            <account-modal
              id="page-account"
              inline
              class="hidden w-full h-full page-content relative z-50"
            ></account-modal>
            <game-stats-modal
              id="page-stats"
              inline
              class="hidden w-full h-full page-content relative z-50"
            ></game-stats-modal>
            <player-profile-modal
              id="page-profile"
              inline
              class="hidden w-full h-full page-content relative z-50"
            ></player-profile-modal>
            <help-modal
              id="page-help"
              inline
              class="hidden w-full h-full page-content relative z-50"
            ></help-modal>
            <language-modal
              id="page-language"
              inline
              class="hidden w-full h-full page-content relative z-50"
            ></language-modal>
            <inventory-modal
              id="page-inventory"
              inline
              class="hidden w-full h-full page-content relative z-50"
            ></inventory-modal>
            <ranked-modal
              id="page-ranked"
              inline
              class="hidden w-full h-full page-content relative z-50"
            ></ranked-modal>
            <detailed-view-modal
              id="page-detailed-view"
              inline
              class="hidden w-full h-full page-content relative z-50"
            ></detailed-view-modal>
            <doctrines-modal

              inline
              class="hidden w-full h-full page-content relative z-50"
            ></doctrines-modal>
            <admin-modal
              id="page-admin"

              class="hidden w-full h-full page-content relative z-50"
            ></admin-modal>
          </main-layout>

          <div class="[.in-game_&]:hidden mt-auto flex flex-col shrink-0">
            <page-footer></page-footer>
          </div>
        </div>
        <!-- End crt-screen-container -->
      </div>
      <!-- End crt-chassis -->

      <!-- Global Modals -->
      <steam-link-modal></steam-link-modal>
      <steam-handoff-modal></steam-handoff-modal>
      <!-- Opened from the nav profile menu (#modal=...) -->
      <account-settings-modal></account-settings-modal>
      <change-username-modal></change-username-modal>
      <subscription-modal></subscription-modal>
    </div>

    <!-- Game components -->
    <div id="app"></div>

    <!-- Bottom HUD: <sm=column, sm..lg=tablet dock, lg+=wide widescreen retro command dock -->
    <div
      class="fixed bottom-0 left-0 w-full z-[200] flex flex-col pointer-events-none sm:items-end lg:items-center px-0 lg:px-2"
      style="
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      "
    >
      <!-- HUD container: spans wide on desktop across window width with minimal height -->
      <div
        class="contents sm:flex sm:flex-col sm:pointer-events-none w-full sm:w-[580px] lg:w-[calc(100%-1rem)] min-[1400px]:w-[calc(100%-1.5rem)] lg:max-w-[1780px] sm:z-10 relative"
      >
        <attacks-display
          class="w-full sm:max-w-[620px] pointer-events-auto order-1 sm:order-none mb-1"
        ></attacks-display>
        <tutorial-panel
          class="hidden w-full order-3 sm:order-none"
        ></tutorial-panel>
        <div
          class="pointer-events-auto bg-[#121813]/95 border-2 border-[#2b3a2d] shadow-[0_12px_40px_rgba(0,0,0,0.9),inset_0_1px_0_rgba(255,255,255,0.08)] sm:rounded-tr-xl lg:rounded-t-xl order-3 sm:order-none relative"
        >
          <!-- Corner tactical screws for retro military console bezel -->
          <div class="crt-screw crt-screw-tl hidden sm:block"></div>
          <div class="crt-screw crt-screw-tr hidden sm:block"></div>
          <div class="crt-screw crt-screw-bl hidden sm:block"></div>
          <div class="crt-screw crt-screw-br hidden sm:block"></div>
          <control-panel class="w-full"></control-panel>
          <unit-display class="hidden lg:block w-full"></unit-display>
        </div>
      </div>

      <!-- Chat: <sm between attacks and control (order-2), sm+ positioned above console on bottom-right -->
      <div
        class="flex flex-col pointer-events-none items-end order-2 sm:order-none sm:fixed sm:right-3 sm:bottom-[78px] lg:bottom-[74px] sm:max-w-[360px] z-20"
      >
        <chat-display
          class="w-full sm:w-auto pointer-events-auto"
        ></chat-display>
      </div>

      <!-- Mini Radio Tactique (Events & Transmissions): <sm between attacks and control (order-2), sm+ positioned on the LEFT side under statistics -->
      <div
        class="flex flex-col pointer-events-none items-start order-2 sm:order-none sm:fixed sm:left-3 sm:bottom-[82px] lg:bottom-[80px] sm:w-[350px] min-[1400px]:w-[380px] z-20"
      >
        <events-display
          class="w-full pointer-events-auto"
        ></events-display>
        <actionable-events
          class="w-full pointer-events-auto"
        ></actionable-events>
      </div>
    </div>

    <!-- Game modals and overlays -->
    <emoji-table></emoji-table>
    <build-menu></build-menu>
    <win-modal></win-modal>
    <new-lobby-prompt></new-lobby-prompt>
    <game-starting-modal></game-starting-modal>
    <div
      class="flex flex-col items-end fixed top-0 right-0 z-1000 gap-2 pointer-events-none"
    >
      <game-right-sidebar class="pointer-events-auto"></game-right-sidebar>
      <replay-panel class="pointer-events-auto"></replay-panel>
      <world-events-banner class="pointer-events-auto"></world-events-banner>
    </div>
    <settings-modal></settings-modal>
    <!-- The in-game settings modal: the same component as #page-settings, but
         non-inline, and mounted out here because the page's copy sits in a
         subtree that is hidden during a match. It must stay AFTER
         #page-settings in document order: ModalRouter.routeFromHash and
         Main.ts both resolve this component with
         document.querySelector("user-setting"), which takes the first match. -->
    <user-setting id="game-settings"></user-setting>
    <player-panel></player-panel>
    <spawn-timer></spawn-timer>
    <immunity-timer></immunity-timer>
    <in-game-promo></in-game-promo>
    <alert-frame></alert-frame>
    <chat-modal></chat-modal>
    <multi-tab-modal></multi-tab-modal>
    <game-left-sidebar></game-left-sidebar>
    <performance-overlay></performance-overlay>
    <player-info-overlay></player-info-overlay>
    <heads-up-message></heads-up-message>

    <!-- Featured stream: direct <body> child (NOT inside the in-[.in-game]:hidden
         home container) so the Twitch iframe is never display:none'd during a game,
         which would unmount the player and break ToS-compliant playback. The
         component is position:fixed and self-manages visibility (pauses in-game). -->
    <featured-stream></featured-stream>

    <!-- Steam shell status bar. A direct <body> child, like
         featured-stream above, so it is not inside the home container -- but
         unlike it, deliberately hidden in-game (see the component's comment).
         Renders nothing outside the desktop shell. -->
    <desktop-status-bar></desktop-status-bar>

    <!-- Scripts -->
    <script>
      // Remove preload class after everything is loaded
      window.addEventListener("load", function () {
        requestAnimationFrame(() => {
          document.documentElement.classList.remove("preload");
        });
      });

      // Fallback: remove preload class after timeout in case DOMContentLoaded never fires
      setTimeout(function () {
        document.documentElement.classList.remove("preload");
      }, 3000);
    </script>

    <script>
      // Fallback sidebar toggle so hamburger works even if module bundle fails to load
      window.__toggleSidebar = function (e) {
        try {
          const sidebar = document.getElementById("sidebar-menu");
          const backdrop = document.getElementById("mobile-menu-backdrop");
          if (!sidebar || !backdrop) return;

          const isOpen = sidebar.classList.contains("open");

          if (isOpen) {
            sidebar.classList.remove("open");
            backdrop.classList.remove("open");
            document.documentElement.classList.remove("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "true");
            sidebar.removeAttribute("aria-modal");
            backdrop.setAttribute("aria-hidden", "true");
          } else {
            sidebar.classList.add("open");
            backdrop.classList.add("open");
            document.documentElement.classList.add("overflow-hidden");
            sidebar.setAttribute("aria-hidden", "false");
            sidebar.setAttribute("aria-modal", "true");
            backdrop.setAttribute("aria-hidden", "false");
          }

          const hb = document.getElementById("hamburger-btn");
          if (hb) hb.setAttribute("aria-expanded", (!isOpen).toString());
        } catch (err) {
          console.error("Toggle failed", err);
        }
      };

      // Wire up the hamburger button inline
      const hamburger = document.getElementById("hamburger-btn");
      if (hamburger) {
        hamburger.onclick = window.__toggleSidebar;
        hamburger.setAttribute("aria-expanded", "false");
      }

      // Wire up backdrop click to close menu
      const backdrop = document.getElementById("mobile-menu-backdrop");
      if (backdrop) {
        backdrop.onclick = function (e) {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        };
      }

      // Wire up Escape key to close menu
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" || e.key === "Esc") {
          const sidebar = document.getElementById("sidebar-menu");
          if (sidebar && sidebar.classList.contains("open")) {
            window.__toggleSidebar(e);
          }
        }
      });
    </script>

    <script type="module" src="/src/client/Main.ts"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((err) => {
            console.warn("SW registration skipped:", err);
          });
        });
      }
    </script>
  </body>
</html>
